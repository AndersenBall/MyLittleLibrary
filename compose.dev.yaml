services:
  api:
    build:
      target: development
    working_dir: /src
    command: dotnet watch --non-interactive --project MyLittleLibrary.Api/MyLittleLibrary.Api.csproj run --no-launch-profile --urls http://+:8080
    volumes:
      - ./backend:/src
    environment:
      DOTNET_ENVIRONMENT: Local
      Auth__EnableLocalDevIdentity: "true"
  frontend:
    environment:
      VITE_LOCAL_DEV_AUTH: "true"